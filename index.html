<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1976d2">
<link rel="manifest" href="manifest.json">
<title>Registro Pasti</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17212b}
header{background:#1976d2;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px}.sub{opacity:.9;margin-top:4px;font-size:14px}
main{padding:14px;max-width:900px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
input[type=date]{font-size:18px;padding:10px;border:1px solid #ccd3da;border-radius:9px;width:100%}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #cfd6dc;padding:6px 3px;text-align:center;overflow:hidden}
th:first-child,td:first-child{text-align:left;width:29%}
th:not(:first-child),td:not(:first-child){width:11.833%}
th{background:#eef2f5}.name{font-weight:600}
button{border:0;border-radius:9px;padding:9px 8px;font-weight:700;cursor:pointer}
.meal{width:100%;min-width:0;background:#e9edf0;color:#555}.meal.yes{background:#c8f1d1;color:#146b2c}.meal.no{background:#ffd2d2;color:#9b1c1c}
.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:#1976d2;color:white}.secondary{background:#e7eaee;color:#222}
.small{font-size:12px;color:#68737d}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:10px 15px;border-radius:20px;display:none;z-index:20}
@media(max-width:600px){
 table{font-size:11px}
 th,td{padding:5px 2px}
 th:first-child,td:first-child{width:29%}
 th:not(:first-child),td:not(:first-child){width:11.833%}
 .meal{font-size:12px;padding:7px 2px}
 .name{max-width:none;word-break:break-word}
}
</style>
</head>
<body>
<header><h1>Registro Pasti</h1><div class="sub">Scuola dell'Infanzia</div></header>
<main>
<section class="card">
<label for="date">Data del registro</label>
<input id="date" type="date">
<div class="actions" style="margin-top:10px">
<button class="primary" onclick="generatePDF()">📄 Genera PDF</button>
<button class="secondary" onclick="clearDay()">🗑️ Cancella giorno</button>
</div>
<p class="small">I dati dei registri vengono conservati localmente per 7 giorni. L'elenco dei bambini rimane.</p>
</section>
<section class="card">
<table>
<thead><tr><th>Nome e Cognome</th><th>Primo</th><th>Secondo</th><th>Contorno</th><th>Frutta</th><th>Cacca</th><th>Nanna</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</section>
<section class="card">
<div class="actions">
<button class="secondary" onclick="setAll('yes')">Tutti SI</button>
<button class="secondary" onclick="setAll('no')">Tutti NO</button>
<button class="secondary" onclick="window.print()">🖨️ Stampa</button>
</div>
</section>
</main>
<div id="toast" class="toast"></div>
<script>
const children=["Adele Bari","Cesare Becatti","Cristina Boccuti","Mathias Carli","Paz Colombo","Brando Giorgi","Ines Morelli","Isabella Morrone","Filippo Paolini","Tiberio Pierini","Margherita Scarpelli","Ariele Terzani","Ludovica Vagnoni","Eleonora Zeppi"];
const meals=["Primo","Secondo","Contorno","Frutta","Cacca","Nanna"];
const dateEl=document.getElementById("date");
dateEl.value=new Date().toISOString().slice(0,10);
function key(){return "registro-"+dateEl.value}
function load(){let d=JSON.parse(localStorage.getItem(key())||"{}");return d}
function save(d){localStorage.setItem(key(),JSON.stringify(d));cleanup()}
function cleanup(){
 const cutoff=Date.now()-7*86400000;
 Object.keys(localStorage).filter(k=>k.startsWith("registro-")).forEach(k=>{
  const dt=Date.parse(k.replace("registro-","")+"T23:59:59");
  if(dt<cutoff)localStorage.removeItem(k);
 });
}
function render(){
 const d=load(), tbody=document.getElementById("rows"); tbody.innerHTML="";
 children.forEach((name,i)=>{
  const tr=document.createElement("tr");
  const td=document.createElement("td");td.className="name";td.textContent=name;tr.appendChild(td);
  meals.forEach((m,j)=>{
   const td=document.createElement("td"), b=document.createElement("button");
   const v=d[i+"-"+j];
   b.className="meal "+(v||""); 
   const isCacca = j===4, isNanna = j===5;
   const icon = isCacca ? "💩" : isNanna ? "😴" : "";
   b.textContent = v==="yes" ? (icon || "SI") : v==="no" ? "NO" : "—";
   b.title = isCacca ? "Cacca" : isNanna ? "Nanna" : m;
   b.onclick=()=>{const nd=load();const k=i+"-"+j;nd[k]=nd[k]==="yes"?"no":nd[k]==="no"?undefined:"yes";if(nd[k]===undefined)delete nd[k];save(nd);render()};
   td.appendChild(b);tr.appendChild(td);
  });tbody.appendChild(tr);
 });
}
function setAll(v){const d={};children.forEach((_,i)=>meals.forEach((_,j)=>d[i+"-"+j]=v));save(d);render();toast(v==="yes"?"Tutti impostati su SI":"Tutti impostati su NO")}
function clearDay(){localStorage.removeItem(key());render();toast("Registro cancellato")}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1600)}
dateEl.onchange=render;
function pdfEscape(s){return String(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
function makePDF(){
 const d=load(), W=595,H=842,left=18,top=48,cols=[155,67,67,67,67,67,67],rowH=27,headerH=30; const ops=[];
 const text=(x,y,s,size=9,bold=false)=>ops.push(`BT /${bold?"F2":"F1"} ${size} Tf ${x} ${y} Td (${pdfEscape(s)}) Tj ET`);
 const rect=(x,y,w,h)=>ops.push(`${x} ${y} ${w} ${h} re S`);
 const date=new Date(dateEl.value+"T12:00:00").toLocaleDateString("it-IT");
 text(175,H-42,"Registro Pasti - Scuola dell'Infanzia",14,true);
 text(left,H-70,"Data:",10,true); text(left+34,H-70,date,10);
 let y=H-top-48;
 const headers=["Nome e Cognome","Primo","Secondo","Contorno","Frutta","Cacca","Nanna"];
 let x=left;
 headers.forEach((h,i)=>{
   rect(x,y-headerH,cols[i],headerH);
   const approx=h.length*(i===0?4.7:4.4);
   text(i===0?x+6:x+(cols[i]-approx)/2,y-19,h,8.5,true);
   x+=cols[i];
 });
 y-=headerH;
 children.forEach((name,i)=>{
   x=left;
   const vals=[name,...meals.map((_,j)=>d[i+"-"+j]==="yes"?"SI":d[i+"-"+j]==="no"?"NO":"")];
   vals.forEach((v,j)=>{
     rect(x,y-rowH,cols[j],rowH);
     if(v){
       const approx=v.length*4.6;
       text(j===0?x+6:x+(cols[j]-approx)/2,y-18,v,8.5,j>0);
     }
     x+=cols[j];
   });
   y-=rowH;
 });
 const stream=ops.join("\n");
 const objects=[
   "<< /Type /Catalog /Pages 2 0 R >>",
   "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
   "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>",
   `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`,
   "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
   "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"
 ];
 let pdf="%PDF-1.4\n",offs=[0];
 for(let i=0;i<objects.length;i++){offs[i+1]=pdf.length;pdf+=(i+1)+" 0 obj\n"+objects[i]+"\nendobj\n"}
 const xref=pdf.length;
 pdf+="xref\n0 "+(objects.length+1)+"\n0000000000 65535 f \n";
 for(let i=1;i<offs.length;i++) pdf+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
 pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
 return new Blob([pdf],{type:"application/pdf"});
}
async function generatePDF(){const blob=makePDF(),filename=`Registro_Pasti_${dateEl.value}.pdf`,file=new File([blob],filename,{type:"application/pdf"}); try{if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){await navigator.share({title:"Registro Pasti",text:"Registro pasti del "+new Date(dateEl.value+"T12:00:00").toLocaleDateString("it-IT"),files:[file]});toast("PDF pronto per la condivisione")}else{const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("PDF creato e scaricato")}}catch(e){if(e.name!=="AbortError")toast("Condivisione non disponibile")}}

cleanup();render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
